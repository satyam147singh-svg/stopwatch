<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChronoSync | Offline</title>
  <style>
    body {
      background: #080b12;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .icon {
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
      border-radius: 18px;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #06b6d4;
    }
    p {
      color: #94a3b8;
      max-width: 380px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      background: linear-gradient(135deg, #06b6d4, #38bdf8);
      color: #050811;
      border: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <img src="icon-192.png" alt="ChronoSync" class="icon">
  <h1>You're Offline</h1>
  <p>ChronoSync works offline! Click below to reload the app from your local cache.</p>
  <button class="btn" onclick="window.location.reload()">Reload ChronoSync</button>
</body>
</html>
